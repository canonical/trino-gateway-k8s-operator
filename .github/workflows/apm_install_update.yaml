name: Auto-Update APM Dependencies
on:
  schedule:
    - cron: '05 8 * * 1' # Run every Monday at 08:05 UTC
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    uses: canonical/canonical-data-mesh-docs/.github/workflows/apm-install-update.yml@main
    secrets: inherit
