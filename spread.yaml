project: trino-gateway-k8s-operator
path: /home/ubuntu/proj
kill-timeout: 60m
warn-timeout: 1m
backends:
  integration-test:
    type: integration-test
    systems:
      - ubuntu-24.04
environment:
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge.yaml}")'
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'
exclude:
  - .git
  - .tox
  - .venv
  - .*_cache
integration-suites:
  tests/integration/:
    summary: trino-gateway-k8s integration tests
    working-dir: ./
    auto-discover: true
    backends:
      - integration-test
    pytest-arguments-template: |
      --juju-model testing
      --no-juju-teardown