[project]
name = "trino-gateway-rock"
version = "0.0.1"
requires-python = ">=3.12"

[dependency-groups]
fmt = [
    "ruff",
]
lint = [
    "ruff",
    "codespell",
    "pyright",
]
integration = [
    "jubilant>=1.8,<2",
    "opcli",
    "pytest",
    "pytest-jubilant>=2.0.1,<3",
]

[tool.uv.sources]
opcli = { git = "https://github.com/canonical/charm-ci.git", tag = "v1.0.1" }

[tool.pytest.ini_options]
minversion = "6.0"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(name)s %(message)s"
filterwarnings = [
    "error",
    "ignore:unclosed file .*:ResourceWarning",
    "ignore:Exception ignored while finalizing file.*:pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
lint.per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"]}
extend-exclude = ["__pycache__", "*.egg_info"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.codespell]
skip = "*.rock,.venv,.tox,.git,.ruff_cache,.pytest_cache,uv.lock"

[tool.pyright]
include = ["tests"]
