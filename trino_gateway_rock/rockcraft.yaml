name: trino-gateway
base: bare
build-base: ubuntu@24.04
version: '0.1'
summary: Packages Trino Gateway in an OCI image.
description: |
    The Trino Gateway rock packages application binaries
    together with its dependencies to be used by the
    Trino Gateway charm.
run-user: _daemon_
platforms:
    amd64:

services:
    trino-gateway:
        override: replace
        command: /bin/bash -c 'while true; do sleep 3600; done'
        startup: enabled

parts:
    trino-gateway:
        plugin: nil
        stage-packages:
            - bash
            - coreutils

