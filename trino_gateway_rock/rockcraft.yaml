name: trino-gateway
base: bare
build-base: ubuntu@24.04
version: '22'
summary: Packages Trino Gateway in an OCI image.
description: |
    The Trino Gateway rock packages application binaries
    together with its dependencies to be used by the
    Trino Gateway charm.
run-user: _daemon_
platforms:
    amd64:

services:
    trino-gateway:
        override: replace
        command: /usr/lib/jvm/java-25-openjdk-amd64/bin/java -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80 -jar /usr/lib/trino-gateway/gateway-ha-jar-with-dependencies.jar /etc/trino-gateway/config.yaml
        startup: enabled

parts:
    trino-gateway:
        plugin: dump
        source: https://maven-central.storage-download.googleapis.com/maven2/io/trino/gateway/gateway-ha/22/gateway-ha-22-jar-with-dependencies.jar
        source-type: file
        source-checksum: sha256/abedd78029913e750969f7bc69f3ac42d7b7fea04895f1a13a85e4eed7ed3a26
        organize:
            gateway-ha-22-jar-with-dependencies.jar: usr/lib/trino-gateway/gateway-ha-jar-with-dependencies.jar

    runtime-packages:
        plugin: nil
        stage-packages:
            - base-files
            - ca-certificates
            - openjdk-25-jre-headless
            - libstdc++6

    # The JRE's cacerts links to /etc/ssl/certs/java/cacerts, which ca-certificates-java
    # generates when a JRE is installed. Package scripts do not run for stage-packages, so the
    # keystore is generated on the build host and copied in; without it, Java trusts no
    # certificate authority.
    java-cacerts:
        plugin: nil
        build-packages:
            - ca-certificates-java
            - openjdk-25-jre-headless
        override-build: |
            install -D -m 644 /etc/ssl/certs/java/cacerts "$CRAFT_PART_INSTALL/etc/ssl/certs/java/cacerts"
